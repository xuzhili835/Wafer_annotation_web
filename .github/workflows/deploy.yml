name: CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# 三个 Secrets 未配置时自动跳过部署(测试照跑),配好后下一次 push 自动激活
env:
  HAS_SSH_SECRETS: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}

jobs:
  test:
    name: 测试(pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest tests/ -q

  deploy:
    name: 部署到服务器
    needs: test
    if: env.HAS_SSH_SECRETS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 信任服务器指纹
        run: |
          mkdir -p ~/.ssh
          echo "正在连接 ${{ secrets.SSH_HOST }}:22 ..."
          if ! ssh-keyscan -H -T 10 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "❌ 连不上 ${{ secrets.SSH_HOST }}:22(10 秒超时)"
            echo "👉 请检查云服务器安全组是否放行入站 TCP 22 端口(源 0.0.0.0/0)"
            exit 1
          fi
          echo "✓ 服务器指纹已记录"

      - name: 同步代码到服务器
        run: |
          HOST_ARG="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh $HOST_ARG "mkdir -p /opt/wafer-label/app /opt/wafer-label/data /opt/wafer-label/backup /opt/wafer-label/venv"
          rsync -avz --delete app/       $HOST_ARG:/opt/wafer-label/app/app/
          rsync -avz --delete static/    $HOST_ARG:/opt/wafer-label/app/static/
          rsync -avz --delete scripts/   $HOST_ARG:/opt/wafer-label/app/scripts/
          rsync -avz --delete deploy/    $HOST_ARG:/opt/wafer-label/app/deploy/
          rsync -avz requirements.txt    $HOST_ARG:/opt/wafer-label/app/requirements.txt

      - name: 执行部署脚本
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash /opt/wafer-label/app/deploy/deploy.sh"

      - name: 公网健康检查(3 次重试)
        run: |
          for i in 1 2 3; do
            sleep 3
            if curl -sSf -m 10 "https://wafer.echeng.xyz/health" -o /dev/null; then
              echo "✅ https://wafer.echeng.xyz 正常"
              exit 0
            fi
            echo "第 $i 次探测失败,重试..."
          done
          echo "⚠ 公网访问异常(服务器本机健康检查已通过,多为 DNS/Cloudflare 未就绪)"
          exit 1
